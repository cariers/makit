[package]
name = "makit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "麻将变体共用的领域模型、上下文、状态机和引擎入口"
readme = "README.md"

[dependencies]
makit-core.workspace = true
makit-context.workspace = true
makit-machine.workspace = true
makit-engine.workspace = true

[lints]
workspace = true

[workspace]
members = [
    ".",
    "crates/makit-context",
    "crates/makit-core",
    "crates/makit-engine",
    "crates/makit-machine",
]
default-members = [
    ".",
    "crates/makit-context",
    "crates/makit-core",
    "crates/makit-engine",
    "crates/makit-machine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cariers/makit"

[workspace.dependencies]
thiserror = "2"
makit = { version = "0.1.0", path = "." }
makit-core = { version = "0.1.0", path = "crates/makit-core" }
makit-machine = { version = "0.1.0", path = "crates/makit-machine" }
makit-context = { version = "0.1.0", path = "crates/makit-context" }
makit-engine = { version = "0.1.0", path = "crates/makit-engine" }
rand = { version = "0.10", default-features = false, features = ["unbiased"] }
rand_chacha = { version = "0.10", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
