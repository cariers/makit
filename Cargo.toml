[workspace]
members = ["crates/makit-context","crates/makit-core", "crates/makit-engine", "crates/makit-machine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cariers/makit"

[workspace.dependencies]
thiserror = "2"
makit-core = { version = "0.1.0", path = "crates/makit-core" }
makit-machine = { version = "0.1.0", path = "crates/makit-machine" }
makit-context = { version = "0.1.0", path = "crates/makit-context" }
rand = { version = "0.10", default-features = false, features = ["unbiased"] }
rand_chacha = { version = "0.10", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
