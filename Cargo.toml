[workspace]
members = ["crates/makit-context","crates/makit-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cariers/makit"

[workspace.dependencies]
thiserror = "2"
makit-core = { version = "0.1.0", path = "crates/makit-core" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
